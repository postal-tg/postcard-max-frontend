<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title }} | Postcard MAX</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background:
        radial-gradient(circle at top left, rgba(255, 215, 0, 0.28), transparent 25%),
        linear-gradient(135deg, #fff8ef 0%, #f3f7ff 45%, #f8f1ff 100%);
      min-height: 100vh;
    }
    .shell {
      max-width: 1280px;
      margin: 0 auto;
      padding: 32px 20px 48px;
    }
    .glass {
      background: rgba(255, 255, 255, 0.84);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(15, 23, 42, 0.08);
      border-radius: 20px;
      box-shadow: 0 16px 40px rgba(15, 23, 42, 0.08);
    }
    .brand {
      font-weight: 800;
      letter-spacing: 0.02em;
    }
    .table td, .table th {
      vertical-align: middle;
    }
  </style>
</head>
<body>
  <div class="shell">
    {% if request.session.get("authenticated") %}
    <nav class="navbar navbar-expand-lg glass px-4 py-3 mb-4">
      <a class="navbar-brand brand" href="/dashboard">Postcard MAX</a>
      <div class="navbar-nav gap-2">
        <a class="nav-link" href="/dashboard">Дашборд</a>
        <a class="nav-link" href="/users">Пользователи</a>
        <a class="nav-link" href="/prompts">Промпты</a>
        <a class="nav-link" href="/generations">Генерации</a>
        <a class="nav-link" href="/errors">Ошибки</a>
      </div>
      <div class="ms-auto">
        <a class="btn btn-outline-dark btn-sm" href="/logout">Выйти</a>
      </div>
    </nav>
    {% endif %}
    {% if backend_error %}
    <div class="alert alert-warning">{{ backend_error }}</div>
    {% endif %}
    {% block content %}{% endblock %}
  </div>
</body>
</html>
